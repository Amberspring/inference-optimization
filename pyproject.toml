[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "inference-optimization"
version = "0.1.0"
description = "Reproducible learning project with explicit experiment provenance"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "httpx==0.28.1", "redis==6.2.0", "prometheus-client==0.22.1"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
